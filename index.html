<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K1 面試準備 · 學校資料 & Q&A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EE;
  --bg-soft:#F3EDDF;
  --card:#FFFDF8;
  --navy:#1B2A4A;
  --navy-soft:#3A4A6B;
  --navy-light:#6B7A99;
  --accent:#C8A24B;
  --brand:#1B2A4A;
  --brand-deep:#2A3D63;
  --brand-2:#C8A24B;
  --line:#E6DEC9;
  --radius:18px;
  --shadow:0 2px 12px rgba(27,42,74,.07);
  --shadow-lg:0 10px 30px rgba(27,42,74,.12);
}



*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--navy);
  font-family:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
/* ===== Header ===== */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(250,246,238,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1100px;margin:0 auto;
  padding:14px 20px 10px;
}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{
  font-family:'Noto Sans TC',sans-serif;
  font-size:1.35rem;font-weight:900;letter-spacing:.02em;
}
.brand span{font-size:.8rem;color:var(--navy-light);font-weight:500}
/* school pills */
.pills-wrap{display:flex;align-items:center;gap:6px}
.pills{
  flex:1;display:flex;gap:8px;
  overflow-x:auto;
  padding:10px 0 12px;
  scrollbar-width:none;
  scroll-behavior:smooth;
}
.pills::-webkit-scrollbar{display:none}
.pill-nav{
  flex-shrink:0;width:28px;height:28px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);
  color:var(--navy-soft);cursor:pointer;
  font-size:1.05rem;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;
}
.pill-nav:hover{border-color:var(--brand);color:var(--brand)}
.pill{
  flex:0 0 auto;
  display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--navy-soft);
  padding:6px 15px;border-radius:999px;
  font-size:.88rem;font-weight:500;
  cursor:pointer;white-space:nowrap;
  transition:all .2s ease;
  font-family:inherit;
}
.pill img{
  width:20px;height:20px;border-radius:50%;
  object-fit:contain;background:#fff;
  border:1px solid var(--line);
}
.pill:hover{border-color:var(--brand);color:var(--navy)}
.pill.active{
  background:var(--brand);color:#FAF6EE;border-color:var(--brand);
  font-weight:700;
  box-shadow:0 4px 12px rgba(27,42,74,.25);
}
.pill.family-pill{border-style:dashed;border-color:var(--accent);color:#8A6D23}
.pill.family-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
/* ===== Main ===== */
main{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
.view{display:none;animation:fadeUp .35s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* hero */
.hero{
  background:linear-gradient(135deg,var(--brand) 0%,var(--brand-deep) 100%);
  color:#FAF6EE;
  border-radius:24px;
  padding:34px 32px;
  margin-bottom:28px;
  box-shadow:var(--shadow-lg);
  position:relative;overflow:hidden;
}
.hero::after{
  content:'';position:absolute;right:-60px;top:-60px;
  width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.1);
}
.hero-inner{display:flex;align-items:center;gap:22px;position:relative;z-index:1}
.hero-text{flex:1}
.hero-logo{
  width:96px;height:96px;flex-shrink:0;
  border-radius:22px;background:#fff;
  object-fit:contain;padding:9px;
  box-shadow:0 6px 18px rgba(0,0,0,.2);
}
.hero .zh{font-family:'Noto Sans TC',sans-serif;font-size:1.9rem;font-weight:900;line-height:1.3}
.hero .en{font-size:.95rem;opacity:.75;margin-top:4px;letter-spacing:.03em}
.hero .tagline{
  margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1;
}
.tag{
  background:rgba(250,246,238,.14);
  border:1px solid rgba(250,246,238,.25);
  padding:4px 13px;border-radius:999px;
  font-size:.8rem;font-weight:500;
}
/* section titles */
.sec-title{
  display:flex;align-items:center;gap:12px;
  margin:36px 0 18px;
}
.sec-title h2{
  font-family:'Noto Sans TC',sans-serif;
  font-size:1.3rem;font-weight:900;
}
.sec-title::after{content:'';flex:1;height:1px;background:var(--line)}
.sec-title .icon{
  width:36px;height:36px;border-radius:10px;
  background:var(--brand);color:#FAF6EE;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;flex-shrink:0;
}
.hint{font-size:.8rem;color:var(--navy-light);margin:-8px 0 14px}
/* info grid */
.info-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:16px;
}
.info-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px 22px 20px;
  box-shadow:var(--shadow);
  transition:transform .2s ease,box-shadow .2s ease;
}
.info-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.ic-head{
  width:100%;display:flex;align-items:center;gap:10px;
  background:none;border:none;cursor:pointer;
  font-family:inherit;color:var(--navy);text-align:left;
  padding:0;margin-bottom:10px;
}
.ic-emoji{font-size:1.35rem;flex-shrink:0;line-height:1}
.ic-head h3{flex:1;font-size:1.02rem;font-weight:700}
.ic-more{font-size:.72rem;color:var(--navy-light);flex-shrink:0}
.ic-arrow{
  flex-shrink:0;width:9px;height:9px;
  border-right:2px solid var(--navy-light);
  border-bottom:2px solid var(--navy-light);
  transform:rotate(45deg);transition:transform .3s ease;
}
.info-card.open .ic-arrow{transform:rotate(225deg)}
.info-card .details{max-height:0;overflow:hidden;transition:max-height .4s ease}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{
  background:var(--bg-soft);
  color:var(--navy-soft);
  font-size:.74rem;font-weight:500;
  padding:3px 10px;border-radius:999px;
  border:1px solid var(--line);
}
.info-card ul{list-style:none}
.info-card li{
  font-size:.9rem;color:var(--navy-soft);
  padding:4px 0 4px 18px;position:relative;
}
.info-card li::before{
  content:'·';position:absolute;left:4px;
  color:var(--brand-2);font-weight:900;
}
.info-card li strong{color:var(--navy)}
/* highlights */
.hl-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:14px;
}
.hl-card{
  background:var(--card);color:var(--navy);
  border:2px solid var(--brand);
  border-radius:var(--radius);
  padding:20px 20px 18px;
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.hl-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hl-card .num{
  font-family:'Noto Sans TC',sans-serif;
  font-size:1.6rem;font-weight:900;color:var(--brand);
  line-height:1;flex-shrink:0;
}
.hl-card h4{font-size:1rem;font-weight:700}
.hl-card p{font-size:.86rem;color:var(--navy-soft);line-height:1.65}
/* accordion */
.qa-list{display:flex;flex-direction:column;gap:12px}
.qa{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
  transition:box-shadow .2s;
}
.qa.open{box-shadow:var(--shadow-lg)}
.qa-q{
  width:100%;text-align:left;
  background:none;border:none;cursor:pointer;
  padding:18px 20px;
  display:flex;align-items:flex-start;gap:14px;
  font-family:inherit;color:var(--navy);
}
.qa-q .qmark{
  flex-shrink:0;width:30px;height:30px;border-radius:9px;
  background:var(--bg-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:.95rem;margin-top:2px;
}
.qa-q .qbody{flex:1;display:flex;flex-direction:column;gap:7px}
.qa-q .qtext{font-size:.98rem;font-weight:700;line-height:1.55}
.qa-q .chips{margin-bottom:0;align-items:center}
.qa-q .chips::before{content:'✅';font-size:.78rem;line-height:1}
.qa-q .chip{background:var(--card);border-color:var(--brand-2)}
.qa-q .arrow{
  flex-shrink:0;margin-top:6px;
  width:12px;height:12px;
  border-right:2px solid var(--navy-light);
  border-bottom:2px solid var(--navy-light);
  transform:rotate(45deg);
  transition:transform .3s ease;
}
.qa.open .arrow{transform:rotate(225deg) translate(-2px,-2px)}
.qa-a{
  max-height:0;overflow:hidden;
  transition:max-height .45s ease;
}
.qa-a-inner{padding:0 20px 20px 64px}
.qa-a p{
  font-size:.92rem;color:var(--navy-soft);
  margin-bottom:10px;
  position:relative;padding-left:16px;
}
.qa-a p::before{content:'▸';position:absolute;left:0;color:var(--brand-2)}
.qa-a p:last-child{margin-bottom:0}
/* family view category */
.cat-block{margin-bottom:34px}
.cat-head{
  display:flex;align-items:center;gap:12px;margin-bottom:14px;
}
.cat-head .badge{
  font-family:'Noto Sans TC',sans-serif;
  background:var(--accent);color:#fff;
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:1rem;flex-shrink:0;
}
.cat-head h3{font-size:1.12rem;font-weight:700}
.cat-head small{color:var(--navy-light);font-weight:500;font-size:.8rem}
/* note card */
.note{
  background:var(--bg-soft);
  border:1px dashed var(--accent);
  border-radius:var(--radius);
  padding:20px 22px;
  color:var(--navy-soft);font-size:.92rem;
}
/* back to top */
#topBtn{
  position:fixed;right:22px;bottom:22px;z-index:40;
  width:46px;height:46px;border-radius:50%;
  background:var(--brand);color:#FAF6EE;border:none;cursor:pointer;
  font-size:1.1rem;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#topBtn.show{opacity:1;pointer-events:auto}
footer{
  text-align:center;color:var(--navy-light);
  font-size:.78rem;padding:30px 20px 40px;
  border-top:1px solid var(--line);
}
@media (max-width:640px){
  .pills{gap:6px}
  .pill{padding:4px 11px;font-size:.8rem;gap:5px}
  .pill img{width:17px;height:17px}
  .hero{padding:26px 22px}
  .hero .zh{font-size:1.5rem}
  .hero-inner{gap:14px}
  .hero-logo{width:64px;height:64px;border-radius:16px;padding:6px}
  .qa-a-inner{padding:0 18px 18px 18px}
  main{padding:20px 14px 60px}
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <h1>任小B K1 面試準備筆記</h1>
      <span>學校背景 · 選校 Q&A · 家庭與理念 Q&A</span>
    </div>
    <div class="pills-wrap">
      <button class="pill-nav" id="pillPrev" aria-label="向左捲動">‹</button>
      <nav class="pills" id="pills"></nav>
      <button class="pill-nav" id="pillNext" aria-label="向右捲動">›</button>
    </div>
  </div>
</header>

<main id="main"></main>

<button id="topBtn" title="回到頂部" aria-label="回到頂部">↑</button>

<footer>任小B K1 面試準備筆記</footer>

  {q:'如果孩子在學校被同學搶玩具，你會怎樣處理？',chips:['聆聽感受','了解情況','表達需要','尋求老師','學習分享'],a:[
    '我會先聽小朋友講發生咩事，了解佢當時嘅感受，而唔會一開始就叫佢忍讓，或者教佢搶返個玩具。',
    '我會教佢用說話表達自己，例如同對方講：「我仲未玩完，可唔可以等我玩完先？」如果雙方都想玩，就可以學習輪流玩。如果對方一直搶，或者情況令佢唔舒服，我會教佢搵老師幫忙。',
    '我覺得呢啲情況都係學習社交嘅機會，最重要係令小朋友學識表達自己、尊重別人，同時知道遇到問題時可以尋求協助。']},
  {q:'如果收到老師電話話佢上堂唔專心，你會點做？唔想返學點做？',chips:['了解情況','問小朋友','同老師合作','找原因','調整','重建信心'],a:[
    '如果老師話小朋友上堂唔專心，我會先多謝老師同我講，再了解清楚係咩情況，例如係偶爾發生，定係持續都有呢個問題，同埋係咩活動或者咩情況之下比較容易分心。',
    '返到屋企我都會同小朋友傾吓，了解佢自己點睇。如果真係有需要，我會同老師一齊睇吓可以點調整，例如座位、互動方式或者活動安排，而唔係單方面怪小朋友。',
    '如果係唔想返學，我都會先了解原因，係咪因為未適應、同同學相處，或者課堂上有啲嘢令佢唔開心。了解原因之後，再同老師合作處理，慢慢幫佢建立返對學校嘅安全感同信心。']}
]},
{badge:'H',cat:'轉校與適應情況',count:'1 條',items:[
  {q:'小朋友而家有冇上 PN（或 K1），點解要轉學校？有冇適應期情況？點樣解決？',chips:['PN','原校正面','K1 新階段','更適合','預先準備','給時間','家校合作'],a:[
    '小朋友而家有讀 PN。其實我哋對原本嘅學校都係正面嘅，今次考慮轉校唔係因為覺得原校唔好，而係去到 K1 呢個階段，我哋希望再搵一個更適合佢下一步發展嘅環境。',
    '我哋比較重視兒童為本、全面發展、語言環境，同埋小朋友係咪可以開心同有興趣咁學習，呢啲亦都係我哋覺得呢間學校比較適合佢嘅地方。',
    '如果轉校，我哋都預咗小朋友可能需要一段適應期，所以會預先同佢講學校嘅情況，畀佢睇吓學校相片，同佢建立正面嘅期待。如果開始時比較慢熱，我哋都會畀佢時間適應，再同老師保持溝通。']}
]},
{badge:'I',cat:'上學安排與承諾',count:'1 條',items:[
  {q:'如果日後返學安排？返學超過一個鐘你哋點安排？（針對住得遠申請人）',chips:['有計劃搬遷','單位放緊賣','搬返市區','縮短交通時間','穩定安排','參與學校活動'],a:[
    '我哋目前有計劃搬遷，現時住嘅單位亦都放緊賣。如果有幸入到貴校，我哋會搬返市區，縮短返學時間，確保孩子唔需要花費太多時間喺交通上。',
    '我哋覺得穩定嘅返學安排好重要，可以讓孩子有更多時間休息同學習，亦方便家長參與學校活動。']}
]}
];

/* ============ Render ============ */
const pillsEl = document.getElementById('pills');
const mainEl = document.getElementById('main');

/* emoji 自動配對：按標題關鍵詞揀 emoji（次序重要） */
const SEC_EMOJI = [
  [/語言|語文|普通話|雙語/,'🗣️'],
  [/英文/,'🔤'],
  [/理念|宗旨|核心/,'💡'],
  [/品德|宗教|靈育|生命/,'❤️'],
  [/體能|藝術|音體美/,'🎨'],
  [/幼小銜接|升小/,'🎒'],
  [/戶外|大自然/,'🌳'],
  [/繪本|閱讀|Reading/,'📖'],
  [/主動學習/,'🚀'],
  [/多感官/,'👀'],
  [/六育/,'⚖️'],
  [/社交|情意/,'🫶'],
  [/幸福/,'🌈'],
  [/遊戲/,'🎲'],
  [/家校|適應/,'🤝'],
  [/校風|文化/,'🌞'],
  [/目標/,'🎯'],
  [/歷史|背景|定位/,'🏛️'],
  [/兒童為本/,'🧒'],
  [/課程|教學|特色/,'📚']
];
function secEmoji(t){for(const [re,e] of SEC_EMOJI){if(re.test(t))return e}return '📌'}
const QA_EMOJI = [
  [/為什麼選擇|為何選擇/,'🏫'],
  [/適合讀我們學校/,'🧒'],
  [/教育理念/,'💡'],
  [/最重要/,'⭐'],
  [/優點/,'👍'],
  [/類型教學/,'🎲'],
  [/怎樣選擇學校/,'🔍'],
  [/其他幼稚園/,'⚖️'],
  [/希望孩子.*獲得|期望學校/,'🎁'],
  [/未來成為/,'🌱'],
  [/幼兒來說最重要/,'⭐'],
  [/優質/,'✨'],
  [/類型的學校|升讀/,'🎒'],
  [/愉快學習.*學術/,'⚖️'],
  [/家校合作/,'🤝'],
  [/衝突/,'🕊️'],
  [/負面信息/,'📵'],
  [/三個詞/,'🏷️'],
  [/優點與需要改進/,'💪'],
  [/照顧孩子過程.*困難/,'🧗'],
  [/戒片/,'🚽'],
  [/誰負責照顧/,'👨‍👩‍👧'],
  [/什麼活動|假期/,'🏖️'],
  [/功課/,'📝'],
  [/鼓勵孩子學習/,'👏'],
  [/重視哪些價值/,'💎'],
  [/閱讀興趣/,'📖'],
  [/培養孩子的興趣/,'🎨'],
  [/發脾氣|爭玩具甚至/,'🌋'],
  [/被人欺負/,'🛡️'],
  [/負面情緒/,'🫂'],
  [/搶玩具/,'🧸'],
  [/唔專心|唔想返學/,'📞'],
  [/轉學校|適應期/,'🔄'],
  [/返學安排|住得遠/,'🚌']
];
function qaEmoji(q){for(const [re,e] of QA_EMOJI){if(re.test(q))return e}return '💬'}
const CAT_EMOJI = {B:'🌟',C:'🤝',D:'🧒',E:'🏡',F:'💎',G:'🛟',H:'🔄',I:'🚌'};

/* 每間學校按 logo 配色：brand 主色、deep 深色、a2 點綴色 */
const THEMES = {
  stcat:   {logo:'logo/logo-stcat.jpg',    brand:'#C4111D', deep:'#8C0D15', a2:'#FF9088'},
  keenmind:{logo:'logo/logo-keenmind.jpg', brand:'#1C7A5E', deep:'#135844', a2:'#F5A623'},
  munsang: {logo:'logo/logo-munsang.jpg',  brand:'#BE1E24', deep:'#8C1419', a2:'#F2CE88'},
  puiching:{logo:'logo/logo-puiching.jpg', brand:'#2743B0', deep:'#1B2F80', a2:'#FF8A80'},
  alliance:{logo:'logo/logo-alliance.jpg', brand:'#32508C', deep:'#22365F', a2:'#C9A861'},
  soka:    {logo:'logo/logo-soka.jpg',     brand:'#189FD6', deep:'#0F7AA8', a2:'#E0487E'},
  lh:      {logo:'logo/logo-LH.jpg',       brand:'#1F6FAD', deep:'#164F7D', a2:'#35C0AB'},
  heepyunn:{logo:'logo/logo-heepyunn.jpg', brand:'#2B3990', deep:'#1E2866', a2:'#9FABE8'},
  cannan:  {logo:'logo/logo-cannan.jpg',   brand:'#4A7FC1', deep:'#35609A', a2:'#FFD23F'},
  hkps:    {logo:'logo/logo-hkps.jpg',     brand:'#2B2E83', deep:'#1E2060', a2:'#FFD800'}
};
const DEFAULT_THEME = {brand:'#1B2A4A', deep:'#2A3D63', a2:'#C8A24B'};
function applyTheme(t){
  const r = document.documentElement.style;
  r.setProperty('--brand', t.brand);
  r.setProperty('--brand-deep', t.deep);
  r.setProperty('--brand-2', t.a2);
}

function chipHTML(chips){
  if(!chips || !chips.length) return '';
  return '<div class="chips">'+chips.map(c=>`<span class="chip">${c}</span>`).join('')+'</div>';
}
function qaHTML(items){
  return '<div class="qa-list">'+items.map(it=>`
    <div class="qa">
      <button class="qa-q" aria-expanded="false">
        <span class="qmark">${qaEmoji(it.q)}</span>
        <span class="qbody">
          <span class="qtext">${it.q}</span>
          ${chipHTML(it.chips)}
        </span>
        <span class="arrow"></span>
      </button>
      <div class="qa-a"><div class="qa-a-inner">
        ${it.a.map(p=>`<p>${p}</p>`).join('')}
      </div></div>
    </div>`).join('')+'</div>';
}

function schoolViewHTML(s){
  const logo = THEMES[s.id]?.logo;
  let html = `
  <div class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <div class="zh">${s.zh}</div>
        <div class="en">${s.en}</div>
      </div>
      ${logo?`<img class="hero-logo" src="${logo}" alt="${s.zh} logo">`:''}
    </div>
    <div class="tagline">${s.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
  </div>`;
  if(s.note){
    html += `<div class="note">${s.note}</div>`;
  }
  if(s.highlights.length){
    html += `<div class="sec-title"><span class="icon">⭐</span><h2>面試最值得記住嘅重點</h2></div>
    <div class="hl-grid">`+
    s.highlights.map(h=>`
      <div class="hl-card">
        <div class="hl-head"><span class="num">${h.n}</span><h4>${h.t}</h4></div>
        <p>${h.d}</p>
      </div>`).join('')+'</div>';
  }
  if(s.sections.length){
    html += `<div class="sec-title"><span class="icon">🏫</span><h2>學校背景資料</h2></div>
    <p class="hint">💡 預設只顯示關鍵詞，㩒卡片可以展開詳細內容</p>
    <div class="info-grid">`+
    s.sections.map(sec=>`
      <div class="info-card">
        <button class="ic-head">
          <span class="ic-emoji">${secEmoji(sec.t)}</span>
          <h3>${sec.t}</h3>
          <span class="ic-more">詳情</span>
          <span class="ic-arrow"></span>
        </button>
        ${chipHTML(sec.chips)}
        <div class="details"><ul>${sec.pts.map(p=>`<li>${p}</li>`).join('')}</ul></div>
      </div>`).join('')+'</div>';
  }
  html += `<div class="sec-title"><span class="icon">💬</span><h2>選校動機與理念 Q&A（${s.qa.length} 條）</h2></div>`;
  html += qaHTML(s.qa);
  return html;
}

function familyViewHTML(){
  let html = `
  <div class="hero">
    <div class="zh">家庭與理念 Q&A</div>
    <div class="en">適用於所有學校面試嘅共通問題</div>
    <div class="tagline">${familyQA.map(c=>`<span class="tag">${CAT_EMOJI[c.badge]||'💬'} ${c.cat}</span>`).join('')}</div>
  </div>`;
  html += familyQA.map(c=>`
    <div class="cat-block">
      <div class="cat-head">
        <span class="badge">${c.badge}</span>
        <h3>${CAT_EMOJI[c.badge]||'💬'} ${c.cat} <small>（${c.count}）</small></h3>
      </div>
      ${qaHTML(c.items)}
    </div>`).join('');
  return html;
}

/* build pills + views */
const views = [];
schools.forEach((s,i)=>{
  const btn = document.createElement('button');
  btn.className = 'pill';
  const logo = THEMES[s.id]?.logo;
  btn.innerHTML = (logo?`<img src="${logo}" alt="">`:'') + `<span>${s.pill}</span>`;
  btn.addEventListener('click',()=>activate(i));
  pillsEl.appendChild(btn);

  const view = document.createElement('section');
  view.className = 'view';
  view.innerHTML = schoolViewHTML(s);
  mainEl.appendChild(view);
  views.push({btn,view});
});
/* family pill */
{
  const btn = document.createElement('button');
  btn.className = 'pill family-pill';
  btn.textContent = '家庭與理念 Q&A';
  btn.addEventListener('click',()=>activate(schools.length));
  pillsEl.appendChild(btn);

  const view = document.createElement('section');
  view.className = 'view';
  view.innerHTML = familyViewHTML();
  mainEl.appendChild(view);
  views.push({btn,view});
}

function activate(i){
  views.forEach((v,j)=>{
    v.btn.classList.toggle('active', i===j);
    v.view.classList.toggle('active', i===j);
  });
  applyTheme(i<schools.length ? (THEMES[schools[i].id]||DEFAULT_THEME) : DEFAULT_THEME);
  views[i].btn.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  window.scrollTo({top:0,behavior:'smooth'});
}
activate(0);

/* pill bar arrows */
document.getElementById('pillPrev').addEventListener('click',()=>pillsEl.scrollBy({left:-240,behavior:'smooth'}));
document.getElementById('pillNext').addEventListener('click',()=>pillsEl.scrollBy({left:240,behavior:'smooth'}));

/* accordion + info-card toggle */
mainEl.addEventListener('click',e=>{
  const ic = e.target.closest('.ic-head');
  if(ic){
    const card = ic.parentElement;
    const det = card.querySelector('.details');
    const open = card.classList.toggle('open');
    det.style.maxHeight = open ? det.scrollHeight+'px' : '0';
    return;
  }
  const btn = e.target.closest('.qa-q');
  if(!btn) return;
  const qa = btn.parentElement;
  const ans = qa.querySelector('.qa-a');
  const open = qa.classList.toggle('open');
  btn.setAttribute('aria-expanded', open);
  ans.style.maxHeight = open ? ans.scrollHeight+'px' : '0';
});

/* back to top */
const topBtn = document.getElementById('topBtn');
window.addEventListener('scroll',()=>{
  topBtn.classList.toggle('show', window.scrollY>400);
},{passive:true});
topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
</script>
</body>
</html>
